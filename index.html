<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>凉丸瓶工作台 · 平民股票基金每日一学</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-2: #6b7280;
    --ink-3: #9ca3af;
    --line: #e8ebf0;
    --brand: #c8161e;       /* 中国红，涨 */
    --brand-soft: #fdf0f0;
    --blue: #2563eb;        /* 知识 */
    --blue-soft: #eef3ff;
    --green: #16a34a;       /* 稳健 */
    --green-soft: #ecf9f0;
    --amber: #d97706;       /* 提示 */
    --amber-soft: #fef6e7;
    --radius: 14px;
    --shadow: 0 1px 3px rgba(17,24,39,.06), 0 6px 18px rgba(17,24,39,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 20px 64px; }

  /* 头部 */
  header { text-align: center; margin-bottom: 20px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 26px; font-weight: 700; letter-spacing: 1px;
  }
  .logo .dot { color: var(--brand); }
  .subtitle { color: var(--ink-2); font-size: 14px; margin-top: 6px; }

  /* 免责声明 */
  .disclaimer {
    background: var(--amber-soft); color: #92400e;
    border: 1px solid #f3d9a8; border-radius: 10px;
    padding: 10px 14px; font-size: 12.5px; margin: 18px 0 22px;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .disclaimer b { white-space: nowrap; }

  /* 行情面板 */
  .market-panel { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 0; }
  .market-item {
    flex: 1; min-width: 148px; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; box-shadow: var(--shadow);
  }
  .market-name { font-size: 12px; color: var(--ink-2); }
  .market-price { font-size: 19px; font-weight: 700; margin-top: 3px; }
  .market-chg { font-size: 12.5px; margin-top: 2px; }
  .market-note { font-size: 11px; color: var(--ink-3); margin-top: 8px; text-align: right; }
  .up { color: #c8161e; }
  .down { color: #16a34a; }

  /* 今日头图卡 */
  .today-hero {
    background: linear-gradient(135deg, #c8161e 0%, #a50f16 100%);
    color: #fff; border-radius: var(--radius); padding: 26px 28px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
  }
  .today-hero::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .hero-date { font-size: 13px; opacity: .85; letter-spacing: 1px; }
  .hero-theme { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .hero-line {
    margin-top: 12px; font-size: 15px; opacity: .95;
    border-left: 3px solid rgba(255,255,255,.6); padding-left: 12px;
  }

  /* 今日操作机会板块 */
  .action-panel {
    margin-top: 20px; border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    background: var(--card); overflow: hidden;
  }
  .action-head {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 22px; color: #fff;
  }
  .signal-dot {
    flex: 0 0 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; background: rgba(255,255,255,.22);
  }
  .action-label { font-size: 12px; opacity: .9; letter-spacing: 1px; }
  .action-signal-text { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .action-note { font-size: 11px; opacity: .75; margin-top: 3px; }
  .action-conclusion {
    padding: 16px 22px; font-size: 15px; font-weight: 600;
    border-top: 1px solid var(--line); background: #fafbfc;
  }
  .action-cols { display: grid; grid-template-columns: 1fr 1fr; }
  .action-col { padding: 16px 22px; }
  .action-col + .action-col { border-left: 1px solid var(--line); }
  .col-title { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-bottom: 10px; }
  .action-col ul { list-style: none; }
  .action-col li {
    font-size: 13.5px; color: #374151; padding: 4px 0 4px 20px; position: relative;
    line-height: 1.55;
  }
  .action-col li::before {
    content: "·"; position: absolute; left: 6px; font-weight: 700; color: var(--ink-3);
  }
  .action-col.checklist li { padding-left: 22px; }
  .action-col.checklist li::before {
    content: "✓"; left: 0; color: var(--green); font-weight: 700;
  }

  /* 卡片网格 */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow);
    padding: 18px 18px 16px; cursor: pointer; transition: .18s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(17,24,39,.09); }
  .card-head { display: flex; align-items: flex-start; gap: 12px; }
  .card-icon {
    flex: 0 0 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .card-title { font-size: 16px; font-weight: 700; }
  .card-summary { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
  .tag {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 999px; margin-bottom: 6px; font-weight: 600;
  }
  .tag.knowledge { background: var(--blue-soft); color: var(--blue); }
  .tag.watch { background: var(--brand-soft); color: var(--brand); }
  .tag.fund { background: var(--green-soft); color: var(--green); }
  .icon.knowledge { background: var(--blue-soft); }
  .icon.watch { background: var(--brand-soft); }
  .icon.fund { background: var(--green-soft); }

  .card-detail {
    display: none; margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--line); font-size: 14px;
    color: #374151; white-space: pre-line; line-height: 1.8;
  }
  .card.open .card-detail { display: block; }
  .card .hint { font-size: 11px; color: var(--ink-3); margin-top: 10px; }
  .card.open .hint { display: none; }

  /* 历史时间轴 */
  .history { margin-top: 30px; }
  .history-title {
    font-size: 16px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .history-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .timeline-item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 10px; box-shadow: var(--shadow);
  }
  .timeline-item .t-date { font-size: 12px; color: var(--ink-3); }
  .timeline-item .t-theme { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .timeline-item .t-line { font-size: 13px; color: var(--ink-2); margin-top: 3px; }

  footer { text-align: center; color: var(--ink-3); font-size: 12px; margin-top: 36px; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .hero-theme { font-size: 19px; }
    .action-cols { grid-template-columns: 1fr; }
    .action-col + .action-col { border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot">●</span>凉丸瓶工作台</div>
    <div class="subtitle">平民股票基金知识 · 每日一学 · 先结论后讲解</div>
  </header>

  <div class="market-panel" id="market-panel"></div>

  <div class="disclaimer">
    <b>⚠️ 风险提示</b>
    <span id="disclaimer-text"></span>
  </div>

  <div id="today-hero"></div>
  <div id="today-action"></div>
  <div class="grid" id="today-cards"></div>

  <div class="history" id="history-wrap" style="display:none;">
    <div class="history-title">📅 往期回顾</div>
    <div id="history-list"></div>
  </div>

  <footer id="footer"></footer>
</div>

<script src="content.js"></script>
<script>
(function () {
  var C = window.CONTENT;
  if (!C || !C.daily || !C.daily.length) return;

  var emoji = { knowledge: "📚", watch: "📈", fund: "🧺" };
  var tagName = { knowledge: "知识", watch: "看盘", fund: "稳健品类" };

  document.getElementById("disclaimer-text").textContent = C.disclaimer;
  document.getElementById("footer").textContent =
    "凉丸瓶工作台 · 内容仅供学习参考 · 最后更新 " + C.lastUpdated;

  var today = C.daily[0];

  // 头图卡
  var hero = document.getElementById("today-hero");
  hero.innerHTML =
    '<div class="today-hero">' +
      '<div class="hero-date">' + today.date + " · " + today.week + '</div>' +
      '<div class="hero-theme">' + today.theme + '</div>' +
      '<div class="hero-line">' + today.oneLiner + '</div>' +
    '</div>';

  // 今日操作机会板块
  var actionBox = document.getElementById("today-action");
  if (today.action) {
    var a = today.action;
    var signalMap = {
      green:  { color: "#16a34a", emoji: "🟢", note: "机会明确 · 可按纪律操作" },
      yellow: { color: "#d97706", emoji: "🟡", note: "方向不明 · 等待更明确信号" },
      red:    { color: "#c8161e", emoji: "🔴", note: "风险较大 · 观望学习为主" }
    };
    var s = signalMap[a.signal] || signalMap.yellow;
    var reasonHtml = (a.reasons || []).map(function (r) { return "<li>" + r + "</li>"; }).join("");
    var checkHtml = (a.checklist || []).map(function (c) { return "<li>" + c + "</li>"; }).join("");
    actionBox.innerHTML =
      '<div class="action-panel">' +
        '<div class="action-head" style="background:' + s.color + '">' +
          '<div class="signal-dot">' + s.emoji + '</div>' +
          '<div>' +
            '<div class="action-label">今日是否有操作机会</div>' +
            '<div class="action-signal-text">' + a.signalText + '</div>' +
            '<div class="action-note">' + s.note + '（信号灯＝操作机会，不是涨跌）</div>' +
          '</div>' +
        '</div>' +
        '<div class="action-conclusion">💡 结论：' + a.conclusion + '</div>' +
        '<div class="action-cols">' +
          '<div class="action-col">' +
            '<div class="col-title">为什么这么判断</div>' +
            '<ul>' + reasonHtml + '</ul>' +
          '</div>' +
          '<div class="action-col checklist">' +
            '<div class="col-title">小白今日行动清单</div>' +
            '<ul>' + checkHtml + '</ul>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // 今日卡片
  var grid = document.getElementById("today-cards");
  today.cards.forEach(function (c) {
    var div = document.createElement("div");
    div.className = "card";
    div.innerHTML =
      '<div class="card-head">' +
        '<div class="card-icon icon ' + c.tag + '">' + (emoji[c.tag] || "📌") + '</div>' +
        '<div>' +
          '<span class="tag ' + c.tag + '">' + (tagName[c.tag] || "") + '</span>' +
          '<div class="card-title">' + c.title + '</div>' +
          '<div class="card-summary">' + c.summary + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card-detail">' + c.detail + '</div>' +
      '<div class="hint">点击展开详情 ↓</div>';
    div.addEventListener("click", function () {
      div.classList.toggle("open");
    });
    grid.appendChild(div);
  });

  // 历史时间轴
  if (C.daily.length > 1) {
    var wrap = document.getElementById("history-wrap");
    var list = document.getElementById("history-list");
    wrap.style.display = "block";
    for (var i = 1; i < C.daily.length; i++) {
      var d = C.daily[i];
      var item = document.createElement("div");
      item.className = "timeline-item";
      item.innerHTML =
        '<div class="t-date">' + d.date + " · " + d.week + '</div>' +
        '<div class="t-theme">' + d.theme + '</div>' +
        '<div class="t-line">' + d.oneLiner + '</div>';
      list.appendChild(item);
    }
  }
})();
</script>
<script>
(function () {
  var map = { sh000001: "上证指数", sz399001: "深证成指", sz399006: "创业板指", sz399300: "沪深300" };
  var codes = "sh000001,sz399001,sz399006,sz399300";
  var box = document.getElementById("market-panel");
  if (!box) return;
  function render(text) {
    var out = "";
    (text || "").split(";").forEach(function (line) {
      var m = line.match(/v_(\w+)="([^"]*)"/);
      if (!m) return;
      var a = m[2].split("~");
      var name = map[m[1]] || m[1];
      var price = a[3], chg = a[31], pct = a[32];
      var up = parseFloat(chg) >= 0;
      var cls = up ? "up" : "down";
      out += '<div class="market-item">'
        + '<div class="market-name">' + name + '</div>'
        + '<div class="market-price ' + cls + '">' + price + '</div>'
        + '<div class="market-chg ' + cls + '">' + (up ? "+" : "") + chg + '　' + (up ? "+" : "") + pct + '%</div>'
        + '</div>';
    });
    if (!out) return;
    out += '<div class="market-note">行情来自公开数据 · 可能有延迟 · 仅供参考</div>';
    box.innerHTML = out;
  }
  function load() {
    fetch("https://qt.gtimg.cn/q=" + codes)
      .then(function (r) { return r.text(); })
      .then(render)
      .catch(function () {});
  }
  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
